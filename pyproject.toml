[build-system]
requires = ["setuptools>=71,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-scdp"
version = "0.1.0"
description = "Reproducible SCDP and Diffusion Policy for Meta-World and real-world data"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "accelerate==1.11.0",
    "av==15.1.0",
    "datasets==4.1.1",
    "diffusers==0.35.2",
    "draccus==0.10.0",
    "einops==0.8.1",
    "gymnasium==1.2.1",
    "huggingface-hub[hf-transfer]==0.35.3",
    "imageio[ffmpeg]==2.37.0",
    "metaworld==3.0.0",
    "mujoco==3.3.7",
    "numpy==2.2.6",
    "packaging==25.0",
    "pandas==2.3.3",
    "pillow==12.0.0",
    "pyarrow==22.0.0",
    "safetensors==0.6.2",
    "torch==2.9.1",
    "torchcodec==0.9.1",
    "torchvision==0.24.1",
    "tqdm==4.67.1",
    "wandb==0.21.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lerobot = [
    "datasets/*.md",
    "envs/*.json",
    "templates/*.md",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
